    /* Chống cache trình duyệt cho hiệu ứng từng từ */
    .wish-line { display: block; margin-bottom: 4px; }
    .wish-line:last-child { margin-bottom: 0; }
    .wish-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      filter: blur(4px);
      margin-right: 0.28em;
      animation: smoothWordFade 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      will-change: opacity, transform, filter;
    }
    @keyframes smoothWordFade {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        filter: blur(4px);
        color: #ff3366;
      }
      50% {
        opacity: 1;
        transform: translateY(-1px) scale(1.03);
        filter: blur(0);
        color: #ff2a6d;
        text-shadow: 0 0 6px rgba(255, 51, 102, 0.35);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
        color: #3b0c1c;
        text-shadow: none;
      }
    }
    /* GPU Hardware Acceleration cho Phong Thư */
    .envelope-box {
      transform: translate3d(-50%, -36%, 0) scale(0.88);
      opacity: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .envelope-box.show {
      transform: translate3d(-50%, -50%, 0) scale(1);
      opacity: 1;
    }
